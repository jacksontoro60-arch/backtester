[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backtester"
version = "0.1.0"
description = "Small long-only daily stock strategy backtester."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jackson Toro" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
backtester = "backtester.cli:main"

[tool.setuptools.packages.find]
include = ["backtester*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
